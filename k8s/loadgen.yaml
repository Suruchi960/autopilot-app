apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["while true; do wget -q -O /dev/null http://autopilot-app/; sleep 0.5; done"]
