apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate
spec:
  args:
    - name: canary-hash
  metrics:
    - name: error-rate
      interval: 10s
      initialDelay: 20s
      count: 4
      failureLimit: 1
      successCondition: result[0] < 0.1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            (sum(rate(http_requests_total{rollouts_pod_template_hash="{{args.canary-hash}}",status="500"}[30s])) or vector(0))
            /
            sum(rate(http_requests_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[30s]))
