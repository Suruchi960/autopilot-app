apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopilot-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autopilot-app
  template:
    metadata:
      labels:
        app: autopilot-app
    spec:
      containers:
        - name: app
          image: suruchi960/autopilot-app:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: autopilot-app
spec:
  selector:
    app: autopilot-app
  ports:
    - port: 80
      targetPort: 5000
